name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.16
    with:
      # we use a custom script instead of the github provided one
      license_header_check_enabled: false
      api_breakage_check_enabled: false

  license-headers:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check license headers
        run: ./scripts/check-license-headers.sh

  unit-tests:
    name: Unit tests
    uses: apple/swift-nio/.github/workflows/unit_tests.yml@main
    with:
      linux_5_10_enabled: false
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_nightly_next_enabled: false
      windows_6_0_enabled: false
      windows_6_1_enabled: false
      windows_nightly_next_enabled: false
      windows_nightly_main_enabled: false

  macos-tests:
    name: macOS tests
    uses: apple/swift-nio/.github/workflows/macos_tests.yml@main
    with:
      runner_pool: general
      build_scheme: apple-ads-platform-api-swift
      swift_6_1_enabled: false
      swift_6_2_enabled: true
      # server-side client: swift build/test covers macOS; other Apple platforms are not supported
      macos_xcode_build_enabled: false
      ios_xcode_build_enabled: false
      watchos_xcode_build_enabled: false
      tvos_xcode_build_enabled: false
      visionos_xcode_build_enabled: false

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@main
    with:
      linux_5_10_enabled: false
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_nightly_next_enabled: false
      windows_6_0_enabled: false
      windows_6_1_enabled: false
      windows_nightly_next_enabled: false
      windows_nightly_main_enabled: false

  postprocessor:
    name: Postprocessor
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: swift build --package-path Tools/Postprocessor
      - name: Test
        run: swift test --package-path Tools/Postprocessor
